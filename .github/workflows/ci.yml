name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run high-signal static checks
        run: |
          ruff check . --no-cache --select E9,F524,F63,F7,F82,F811,F841,B023,ASYNC221,ASYNC230,S110,S112,PLW0602,PLW0211,G201
          bandit -q -r app bot deploy -x tests --severity-level high --confidence-level high
      - name: Check API contract snapshots
        run: python scripts/sync_api_contracts.py --check
      - name: Compile Python sources
        run: python -m compileall -q -f .
      - name: Run test suite
        env:
          QQBOT_DISABLE_FILE_LOG: "1"
        run: python -m unittest discover -v
